<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 14px;
      color: #2a2622;
    }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; margin: 10px 0 3px; color: #6f675e; font-size: 12px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      border: 0;
      border-radius: 8px;
      background: #b5502a;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #eee; color: #444; margin-top: 8px; font-weight: 500; }
    #status { margin-top: 8px; font-size: 12px; color: #6f675e; min-height: 15px; }
  </style>
</head>
<body>
  <h1>Margins Web Clipper</h1>
  <button id="clip">✂ Save this page</button>
  <button id="open" class="secondary">Open library</button>
  <label for="server">Server URL</label>
  <input id="server" placeholder="http://localhost:8321">
  <label for="token">Access token (if set)</label>
  <input id="token" type="password" placeholder="optional">
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
